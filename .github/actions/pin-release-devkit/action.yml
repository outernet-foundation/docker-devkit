name: pin-release-devkit
description: Check out release-devkit at the pinned SHA for run-from-source composite consumption

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        repository: outernet-foundation/release-devkit
        ref: ${{ env.RELEASE_DEVKIT_SHA }}
        path: .release-devkit
        persist-credentials: false
