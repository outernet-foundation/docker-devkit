name: pin-python-devkit
description: Check out python-devkit at the pinned SHA for run-from-source composite consumption

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        repository: outernet-foundation/python-devkit
        ref: ${{ env.PYTHON_DEVKIT_SHA }}
        path: .python-devkit
        persist-credentials: false
