name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_run:
    workflows: [CI/CD]
    types: [completed]
    branches: [dev]

env:
  RELEASE_DEVKIT_VERSION: 0.1.25

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_run' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run preflight-python

  publish-dry-run:
    if: github.event_name != 'workflow_run' && github.ref != 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - shell: bash
        run: uvx --from release-devkit==${{ env.RELEASE_DEVKIT_VERSION }} publish-stable --dry-run

  ensure-release-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [check, publish-dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - shell: bash
        run: uvx --from release-devkit==${{ env.RELEASE_DEVKIT_VERSION }} ensure-release-pr

  publish-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: publish-stable
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: git fetch --tags origin
        shell: bash
      - uses: astral-sh/setup-uv@v7
      - shell: bash
        run: uvx --from release-devkit==${{ env.RELEASE_DEVKIT_VERSION }} publish-stable
        env:
          NPM_CONFIG_LOGLEVEL: verbose

  publish-dev:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: git fetch --tags origin
        shell: bash
      - uses: astral-sh/setup-uv@v7
      - shell: bash
        run: uvx --from release-devkit==${{ env.RELEASE_DEVKIT_VERSION }} publish-dev --run-id ${{ github.event.workflow_run.id }}
        env:
          NPM_CONFIG_LOGLEVEL: verbose
