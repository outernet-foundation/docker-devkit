[project]
name = "docker-devkit"
version = "0.0.0.dev0"
description = "Docker-stack lifecycle commands (up/down/build) driven by a pyproject-declared compose assembly"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "ci-devkit>=0.1.15",
    "packaging>=24.1",
    "pathspec>=1.0.4",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
    "pyyaml>=6.0",
    "strictyaml>=1.7.3",
    "typer>=0.17.4",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.14.11",
    "pytest>=8.0.0",
    "python-devkit>=0.1.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-strictyaml>=1.7.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
up = "docker_devkit.up:app"
down = "docker_devkit.down:app"
build = "docker_devkit.build_docker:app"
mirror = "docker_devkit.mirror:app"
generate-score = "docker_devkit.score_generate:app"
docker-build-matrix = "docker_devkit.matrix:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docker_devkit"]
include = ["src/docker_devkit/py.typed"]

[tool.uv.sources]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
